name: Checkout lockfile control

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@373d742f768e37e4e68d84ada06be93fb2ce64d8
        with:
          persist-credentials: false
      - name: Confirm checkout
        run: test -f README.md
